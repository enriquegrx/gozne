components:
  securitySchemes:
    LoginContext:
      type: apiKey
      in: cookie
      name: __Host-gozne-login
      description: Secure; HttpOnly; SameSite=Strict; Path=/; no Domain
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-gozne-session
      description: Secure; HttpOnly; SameSite=Strict; Path=/; no Domain
  schemas:
    ApplicationDefinition:
      type: object
      additionalProperties: false
      required:
        - id
        - origin
        - evmChainIds
        - solanaChains
        - requiredRoles
      properties:
        id: &id001
          type: string
          pattern: ^[a-z][a-z0-9-]{0,63}$
        origin:
          type: string
          format: uri
        adminOrigin:
          type: string
          format: uri
        evmChainIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        solanaChains:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            enum:
              - solana:mainnet
              - solana:devnet
              - solana:testnet
        requiredRoles:
          type: array
          maxItems: 20
          uniqueItems: true
          items: *id001
    ApplicationDirectory:
      type: object
      additionalProperties: false
      required:
        - revision
        - canManage
        - currentApplication
        - applications
      properties:
        revision:
          type: string
          pattern: ^[a-f0-9]{64}$
        canManage:
          type: boolean
        currentApplication: *id001
        applications:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApplicationDefinition'
    ApplicationUpdate:
      type: object
      additionalProperties: false
      required:
        - revision
        - create
        - application
      properties:
        revision:
          type: string
          pattern: ^[a-f0-9]{64}$
        create:
          type: boolean
        application:
          allOf:
            - $ref: '#/components/schemas/ApplicationDefinition'
            - required:
                - adminOrigin
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        identity:
          type: string
        application:
          type: string
        roles:
          type: array
          items:
            type: string
        expiresAt:
          type: integer
          description: Unix milliseconds
        csrfToken:
          type: string
          pattern: ^[0-9a-f]{64}$
        network:
          type: string
          enum:
            - evm
            - solana
        address:
          type: string
      required:
        - id
        - identity
        - application
        - roles
        - expiresAt
        - csrfToken
        - network
        - address
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid
          required:
            - code
            - message
            - request_id
      required:
        - error
    DeploymentPayload:
      type: object
      additionalProperties: false
      properties:
        project:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        environment:
          type: string
          enum:
            - preview
            - staging
            - production
      required:
        - project
        - version
        - environment
    Action:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        application:
          type: string
        requester:
          type: string
        payload:
          $ref: '#/components/schemas/DeploymentPayload'
        payloadHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        createdAt:
          type: integer
        expiresAt:
          type: integer
        status:
          type: string
          enum:
            - pending
            - approved
            - executed
            - canceled
            - expired
        approvedBy:
          type:
            - string
            - 'null'
        approvedAt:
          type:
            - integer
            - 'null'
        approvalExpiresAt:
          type:
            - integer
            - 'null'
        executedAt:
          type:
            - integer
            - 'null'
      required:
        - id
        - application
        - requester
        - payload
        - payloadHash
        - createdAt
        - expiresAt
        - status
        - approvedBy
        - approvedAt
        - approvalExpiresAt
        - executedAt
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        network:
          type: string
          enum:
            - evm
            - solana
        address:
          type: string
        createdBy:
          type: string
        createdAt:
          type: integer
        expiresAt:
          type: integer
        revokedAt:
          type:
            - integer
            - 'null'
        acceptedAt:
          type:
            - integer
            - 'null'
      required:
        - id
        - network
        - address
        - createdBy
        - createdAt
        - expiresAt
        - revokedAt
        - acceptedAt
    InvitationCreated:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        network:
          type: string
          enum:
            - evm
            - solana
        address:
          type: string
        expiresAt:
          type: integer
        roles:
          type: array
          items:
            const: reader
          minItems: 1
          maxItems: 1
        url:
          type: string
          format: uri
          description: Normal login URL; no secret bearer token
      required:
        - id
        - network
        - address
        - expiresAt
        - roles
        - url
    Deployment:
      type: object
      additionalProperties: false
      properties:
        actionId: *id003
        project: &id004
          type: string
        version: &id005
          type: string
        environment: &id006
          type: string
          enum:
            - preview
            - staging
            - production
        executedAt: &id007
          type: integer
      required:
        - actionId
        - project
        - version
        - environment
        - executedAt
    ExecutionReceipt:
      type: object
      additionalProperties: false
      properties:
        actionId: *id003
        project: *id004
        version: *id005
        environment: *id006
        executedAt: *id007
        simulated:
          type: boolean
          const: true
      required:
        - actionId
        - project
        - version
        - environment
        - executedAt
        - simulated
    Execution:
      type: object
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/Action'
        receipt:
          $ref: '#/components/schemas/ExecutionReceipt'
      required:
        - action
        - receipt
    SessionMetadata:
      type: object
      additionalProperties: false
      properties:
        id: *id003
        identity:
          type: string
        createdAt:
          type: integer
        expiresAt:
          type: integer
        network:
          type: string
          enum:
            - evm
            - solana
        address:
          type: string
      required:
        - id
        - identity
        - createdAt
        - expiresAt
        - network
        - address
    ControlOverview:
      type: object
      additionalProperties: false
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ControlAction'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionMetadata'
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
      required:
        - actions
        - invitations
        - sessions
        - deployments
    ActionChallenge:
      type: object
      additionalProperties: false
      properties:
        nonce:
          type: string
          pattern: ^[a-f0-9]{32}$
        message:
          type: string
        expiresAt:
          type: integer
        signInInput:
          type: object
          additionalProperties: true
      required:
        - nonce
        - message
        - expiresAt
    Ok:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    ControlAction:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        application:
          type: string
        requester:
          type: string
        payload:
          $ref: '#/components/schemas/DeploymentPayload'
        payloadHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        createdAt:
          type: integer
        expiresAt:
          type: integer
        status:
          type: string
          enum:
            - pending
            - approved
            - executed
            - canceled
            - expired
        approvedBy:
          type:
            - string
            - 'null'
        approvedAt:
          type:
            - integer
            - 'null'
        approvalExpiresAt:
          type:
            - integer
            - 'null'
        executedAt:
          type:
            - integer
            - 'null'
        permissions:
          type: object
          additionalProperties: false
          properties:
            approve:
              type: boolean
            execute:
              type: boolean
            cancel:
              type: boolean
          required:
            - approve
            - execute
            - cancel
      required:
        - id
        - application
        - requester
        - payload
        - payloadHash
        - createdAt
        - expiresAt
        - status
        - approvedBy
        - approvedAt
        - approvalExpiresAt
        - executedAt
        - permissions
    UserWallet:
      type: object
      additionalProperties: false
      properties:
        network:
          type: string
          enum:
            - evm
            - solana
        address:
          type: string
          minLength: 32
          maxLength: 64
        enabled:
          type: boolean
      required:
        - network
        - address
        - enabled
    ManagedUser:
      type: object
      additionalProperties: false
      properties:
        id: &id008
          type: string
          pattern: ^[a-z][a-z0-9-]{0,63}$
        roles: &id009
          type: array
          maxItems: 20
          uniqueItems: true
          items: *id008
        wallets: &id011
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/UserWallet'
        walletsEditable:
          type: boolean
      required:
        - id
        - roles
        - wallets
        - walletsEditable
    UserDirectory:
      type: object
      additionalProperties: false
      properties:
        revision: &id010
          type: string
          pattern: ^[a-f0-9]{64}$
        application: *id008
        requiredRoles: *id009
        users:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ManagedUser'
      required:
        - revision
        - application
        - requiredRoles
        - users
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        revision: *id010
        create:
          type: boolean
        id: *id008
        roles: *id009
        wallets: *id011
      required:
        - revision
        - create
        - id
        - roles
        - wallets
    UserUpdateResult:
      type: object
      additionalProperties: false
      properties:
        changed:
          type: boolean
        reauthenticationRequired:
          type: boolean
      required:
        - changed
        - reauthenticationRequired
