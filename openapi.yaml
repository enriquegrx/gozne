openapi: 3.1.0
info:
  title: Gozne
  version: 0.1.0-dev.10
  description:
    Alpha EVM/SIWS authentication and signed simulation controls. API and login
    require the same HTTPS origin within each surface. Control paths exist only
    on the private admin surface (GOZNE_SURFACE=admin), never the public
    listener. Authentication returns 503 without a policy.
paths:
  /healthz:
    get:
      summary: Check SQLite read availability
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
        '503':
          description: Missing policy or unavailable storage; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /version:
    get:
      summary: Version and capabilities
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  name:
                    type: string
                    const: gozne
                  version:
                    type: string
                  stage:
                    type: string
                    const: alpha
                  authentication:
                    type: boolean
                    const: true
                required:
                  - name
                  - version
                  - stage
                  - authentication
  /v1/auth/nonce:
    post:
      summary: Issue a five-minute login challenge and browser context cookie
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  nonce:
                    type: string
                    pattern: ^[0-9a-f]{32}$
                  message:
                    type: string
                  expiresAt:
                    type: integer
                  signInInput:
                    type: object
                    description:
                      Sign-In With Solana fields; present only for Solana
                    additionalProperties: true
                required:
                  - nonce
                  - message
                  - expiresAt
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid proof or session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or application denied, or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Missing policy or unavailable storage; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Policy changed during issuance; request a new challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                application:
                  type: string
                  maxLength: 64
                  pattern: ^[a-z][a-z0-9-]*$
                network:
                  type: string
                  enum:
                    - evm
                    - solana
                address:
                  type: string
                  maxLength: 64
                chainId:
                  type: string
                  maxLength: 32
                  description: 'Examples: 1, solana:mainnet, solana:devnet'
              required:
                - application
                - network
                - address
                - chainId
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
            format: uri
          description: Exact application HTTPS origin
  /v1/auth/verify:
    post:
      summary:
        Verify the exact message and issue a session lasting at most one hour
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid proof or session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or application denied, or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Missing policy or unavailable storage; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nonce:
                  type: string
                  pattern: ^[0-9a-f]{32}$
                message:
                  type: string
                  maxLength: 4096
                signature:
                  type: string
                  maxLength: 256
                  description:
                    'EVM: 65 hexadecimal bytes prefixed with 0x. Solana: 64
                    bytes in base64.'
              required:
                - nonce
                - message
                - signature
      security:
        - LoginContext: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
            format: uri
          description: Exact application HTTPS origin
  /v1/auth/me:
    get:
      summary: Read current session and CSRF token
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid proof or session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or application denied, or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Missing policy or unavailable storage; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - SessionCookie: []
  /v1/auth/validate:
    get:
      summary: Internal proxy validation; do not expose to browsers
      responses:
        '200':
          description: Success
          headers:
            X-Gozne-Identity:
              schema:
                type: string
              description: Internal identity
            X-Gozne-Role:
              schema:
                type: string
              description: Comma-separated roles
            X-Gozne-Application:
              schema:
                type: string
              description: Authorized application
            X-Gozne-Session:
              schema:
                type: string
              description: Public audit ID, not a session token
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid proof or session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or application denied, or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Missing policy or unavailable storage; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: application
          required: true
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9-]*$
  /v1/auth/logout:
    post:
      summary: Revoke the session and clear cookies
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid proof or session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or application denied, or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Missing policy or unavailable storage; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - SessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
            format: uri
          description: Exact application HTTPS origin
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
  /v1/auth/control:
    get:
      summary: Read the current application control overview
      description:
        Up to 100 recent actions. Readers see actions from their current session
        only. Administrators also receive up to 100 invitations and active
        sessions. All authorized users receive up to 20 simulated deployment
        receipts. Counters should not be treated as lifetime totals.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlOverview'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or pending-state limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Policy or storage unavailable; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/control/invitations:
    post:
      summary: Grant temporary reader access to an unconfigured wallet
      description:
        Requires admin and reader in the current application. Static wallet
        entries cannot be invited. Only applications requiring no role other
        than reader support invitations. Validity starts immediately; acceptance
        is the first successful wallet login.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or pending-state limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Policy or storage unavailable; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                network:
                  type: string
                  enum:
                    - evm
                    - solana
                address:
                  type: string
                  minLength: 32
                  maxLength: 64
                minutes:
                  type: integer
                  minimum: 5
                  maximum: 1440
              required:
                - network
                - address
                - minutes
      parameters:
        - &id001
          in: header
          name: Origin
          required: true
          schema:
            type: string
            format: uri
          description: Exact application HTTPS origin
        - &id002
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
  /v1/auth/control/invitations/{id}/revoke:
    post:
      summary: Revoke a wallet invitation immediately
      description:
        Administrator only. Existing guest sessions stop authorizing on their
        next check.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or pending-state limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Policy or storage unavailable; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
      parameters:
        - *id001
        - *id002
        - in: path
          name: id
          required: true
          schema: &id003
            type: string
            format: uuid
  /v1/auth/control/actions:
    post:
      summary: Request a simulated deployment
      description:
        Any authorized session. Payload is immutable. Expires after at most 30
        minutes, bounded by the requesting session. Only the original session
        can execute.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or pending-state limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Policy or storage unavailable; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPayload'
      parameters:
        - *id001
        - *id002
  /v1/auth/control/actions/{id}/challenge:
    post:
      summary: Issue a fresh administrator action proof
      description:
        Requires admin. Bound to action, payload hash, signing wallet and
        session. Five-minute maximum, capped by request and administrator
        session. Replaces the same session/action challenge.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionChallenge'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or pending-state limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Policy or storage unavailable; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                chainId:
                  type: string
                  minLength: 1
                  maxLength: 32
              required:
                - chainId
      parameters:
        - *id001
        - *id002
        - in: path
          name: id
          required: true
          schema: *id003
  /v1/auth/control/actions/{id}/approve:
    post:
      summary: Verify and consume an exact signed action proof
      description:
        Requires the issuing administrator session. Invalid matched proofs
        consume their nonce. Approval expires at the original challenge
        deadline; no new five-minute window is added.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or pending-state limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Policy or storage unavailable; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nonce:
                  type: string
                  pattern: ^[a-f0-9]{32}$
                message:
                  type: string
                  minLength: 1
                  maxLength: 4096
                signature:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - nonce
                - message
                - signature
      parameters:
        - *id001
        - *id002
        - in: path
          name: id
          required: true
          schema: *id003
  /v1/auth/control/actions/{id}/execute:
    post:
      summary: Commit a simulated deployment exactly once per action
      description:
        Original requesting session only. Both requester and administrator
        sessions must still authorize. Effect, consumption and audit share one
        SQLite transaction. No external deployment runs. A repeat returns 409.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or pending-state limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Policy or storage unavailable; deny access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
      parameters:
        - *id001
        - *id002
        - in: path
          name: id
          required: true
          schema: *id003
  /v1/auth/control/actions/{id}/cancel:
    post:
      summary: Cancel a pending or approved action
      description:
        Original requesting session or administrator in the same application.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, origin or CSRF denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description:
            Operation unavailable, already consumed, expired or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
