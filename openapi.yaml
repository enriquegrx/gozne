components:
  securitySchemes:
    LoginContext:
      type: apiKey
      in: cookie
      name: __Host-gozne-login
      description: Secure; HttpOnly; SameSite=Strict; Path=/; no Domain
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-gozne-session
      description: Secure; HttpOnly; SameSite=Strict; Path=/; no Domain
    ApplicationServiceToken:
      type: http
      scheme: bearer
      description:
        Per-application secret configured through GOZNE_AUTHORIZATION_TOKENS;
        use only across the private service network
  schemas:
    ApplicationDefinition:
      type: object
      additionalProperties: false
      required:
        - id
        - origin
        - evmChainIds
        - solanaChains
        - requiredRoles
      properties:
        id: &id001
          type: string
          pattern: ^[a-z][a-z0-9-]{0,63}$
        origin:
          type: string
          format: uri
        adminOrigin:
          type: string
          format: uri
        evmChainIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        solanaChains:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            enum:
              - solana:mainnet
              - solana:devnet
              - solana:testnet
        requiredRoles:
          type: array
          maxItems: 20
          uniqueItems: true
          items: *id001
        approvalThreshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description:
            Distinct live administrator identities required for an action
        authorization:
          $ref: '#/components/schemas/AuthorizationModel'
    Permission:
      type: string
      maxLength: 64
      pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
    ResourceKey:
      type: string
      maxLength: 97
      pattern: ^[a-z][a-z0-9-]{0,31}:[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    AuthorizationResource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: *id001
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        parent:
          $ref: '#/components/schemas/ResourceKey'
    AuthorizationModel:
      type: object
      additionalProperties: false
      required: [permissions, roles, resources]
      properties:
        permissions:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        roles:
          type: object
          maxProperties: 50
          additionalProperties:
            type: array
            maxItems: 100
            uniqueItems: true
            items:
              anyOf:
                - $ref: '#/components/schemas/Permission'
                - const: '*'
        resources:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AuthorizationResource'
    ResourceGrant:
      type: object
      additionalProperties: false
      required: [identity, role, resource]
      properties:
        identity: *id001
        role: *id001
        resource:
          type: string
          description:
            Exact resource key or a declared type wildcard such as document:*
        notBefore:
          type: integer
          minimum: 1
          description:
            Optional Unix-millisecond start; earlier checks never match
        expiresAt:
          type: integer
          minimum: 1
          description:
            Optional Unix-millisecond expiry; expired grants never match
        conditions:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            environments:
              type: array
              maxItems: 20
              uniqueItems: true
              items: *id001
            maximumAmount:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: Maximum amount in application-defined minor units
    AuthorizationContext:
      type: object
      additionalProperties: false
      properties:
        environment: *id001
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Amount in application-defined minor units
    AuthorizationCheck:
      type: object
      additionalProperties: false
      required: [permission, resource]
      properties:
