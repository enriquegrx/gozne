  /v1/auth/control/sessions/{id}/revoke:
    post:
      summary: Revoke another active session in the current application
      description:
        Administrator only. Cross-application or inactive targets return 404.
        The current session returns 409 USE_LOGOUT. Revocation and audit commit
        atomically and invalidate approvals bound to that session.
      security:
        - SessionCookie: []
      responses:
        '200':
