resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
set $gozne_gateway http://gateway:3001;
set $gozne_demo http://demo-app:8080;
proxy_connect_timeout 2s;
proxy_read_timeout 5s;
proxy_send_timeout 5s;
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control no-store always;
root /usr/share/nginx/html;

location = /v1/auth/validate { return 404; }
location = /v1/auth/validate-request { return 404; }
location = /v1/auth/control { return 404; }
location ^~ /v1/auth/control/ { return 404; }
location ^~ /v1/internal/ { return 404; }
location /v1/auth/ {
  proxy_pass $gozne_gateway;
  proxy_pass_request_headers off;
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header X-CSRF-Token $http_x_csrf_token;
}
location = /healthz { proxy_pass $gozne_gateway/healthz; }
location = /version { proxy_pass $gozne_gateway/version; }

location = /_gozne_check {
  internal;
  proxy_pass $gozne_gateway/v1/auth/validate?application=quique;
  proxy_method GET;
  proxy_pass_request_body off;
  proxy_pass_request_headers off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
}
location /private/ {
  auth_request /_gozne_check;
  auth_request_set $gozne_identity $upstream_http_x_gozne_identity;
  auth_request_set $gozne_role $upstream_http_x_gozne_role;
  auth_request_set $gozne_application $upstream_http_x_gozne_application;
  auth_request_set $gozne_session $upstream_http_x_gozne_session;
  error_page 401 = @login;
  proxy_pass $gozne_demo/;
  # Allowlist outgoing headers: no client-supplied X-Gozne-* header survives.
  proxy_pass_request_headers off;
  proxy_set_header Host $host;
  proxy_set_header X-Gozne-Identity $gozne_identity;
  proxy_set_header X-Gozne-Role $gozne_role;
  proxy_set_header X-Gozne-Application $gozne_application;
  proxy_set_header X-Gozne-Session $gozne_session;
}
location @login {
  absolute_redirect off;
  return 302 /;
}
location = / { try_files /index.html =404; }
location = /index.html { try_files $uri =404; }
location = /style.css { try_files $uri =404; }
location = /brand/symbol.png { try_files $uri =404; }
location ^~ /wallets/ { try_files $uri =404; }
location = /workspace.js { try_files $uri =404; }
location = /i18n.js { try_files $uri =404; }
location = /login.js { try_files $uri =404; }
location / { return 404; }
