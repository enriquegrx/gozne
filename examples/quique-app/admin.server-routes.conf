resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
set $gozne_gateway http://admin-api:3001;
proxy_connect_timeout 2s;
proxy_read_timeout 5s;
proxy_send_timeout 5s;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control no-store always;
root /usr/share/nginx/html;

location = /v1/auth/validate { return 404; }
location = /v1/auth/validate-request { return 404; }
location ^~ /v1/internal/ { return 404; }
location /v1/auth/ {
  proxy_pass $gozne_gateway;
  proxy_pass_request_headers off;
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header X-CSRF-Token $http_x_csrf_token;
}
location = /healthz { proxy_pass $gozne_gateway/healthz; }
location = /version { proxy_pass $gozne_gateway/version; }

location = / { root /tmp; try_files /admin.html =404; }
location = /style.css { try_files $uri =404; }
location = /i18n.js { try_files $uri =404; }
location = /login.js { try_files $uri =404; }
location = /applications.js { try_files $uri =404; }
location = /authorization.js { try_files $uri =404; }
location = /panel.js { try_files $uri =404; }
location / { return 404; }
