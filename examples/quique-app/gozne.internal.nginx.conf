# Install only on the internal Nginx host; never add this hostname to a public tunnel.
# Certificate and key are delivered from pki01's gozne.quique.es Certbot lineage.
server {
    listen 172.26.200.115:443 ssl;
    server_name gozne.quique.es;
    ssl_certificate /etc/nginx/tls/gozne.quique.es/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/gozne.quique.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    access_log off;
    # Confirm routed VPN ranges on the target before extending this list.
    deny 172.26.200.113; # The public tunnel connector is not an administrative client.
    allow 172.26.200.0/24;
    deny all;
    location / {
        proxy_pass http://172.26.200.110:3013;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
