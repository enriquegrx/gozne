worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 16k;
  server {
    # This listener is published only on the Docker host's internal address.
    listen 8443 ssl;
    server_name gozne.quique.es;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GozneTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    deny 172.26.200.113; # Never admit the public Cloudflare connector.
    allow 127.0.0.1;
    allow 172.26.200.0/24;
    allow 172.26.201.0/24;
    deny all;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/admin-routes.conf;
  }
}
