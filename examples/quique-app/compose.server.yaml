name: quique-workspace-server
services:
  gateway:
    restart: unless-stopped
    networks: [public-backend]
    environment:
      GOZNE_SURFACE: public
    build: ../..
    image: gozne:dev
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    volumes:
      - state:/app/state
      - ${QUIQUE_POLICY_FILE:-./policy.server.local.json}:/app/policy.json:ro
    mem_limit: 256m
    pids_limit: 100
  demo-app:
    restart: unless-stopped
    networks: [public-backend]
    image: gozne:dev
    command: [node, /demo/server.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./server.mjs:/demo/server.mjs:ro
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  proxy:
    restart: unless-stopped
    networks: [public-entry, public-backend]
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:9b87ad3dd9f431c733f19dfb278c7eb3dba9dca381942c79818bb42f1a566a83
    entrypoint: [nginx, -g, 'daemon off;']
    ports:
      - '${QUIQUE_BIND_ADDRESS:-127.0.0.1}:3012:8080'
    depends_on:
      gateway:
        condition: service_healthy
      demo-app:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    volumes:
      - ./public.server.conf:/etc/nginx/nginx.conf:ro
      - ./routes.conf:/etc/nginx/gozne-routes.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./brand/symbol.png:/usr/share/nginx/html/brand/symbol.png:ro
      - ./wallets:/usr/share/nginx/html/wallets:ro
      - ./workspace.js:/usr/share/nginx/html/workspace.js:ro
      - ../login/login.js:/usr/share/nginx/html/login.js:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
  admin-api:
    restart: unless-stopped
    image: gozne:dev
    environment:
      GOZNE_SURFACE: admin
    networks: [admin-backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    volumes:
      - state:/app/state
    mem_limit: 256m
    pids_limit: 100
  admin-panel:
    restart: unless-stopped
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:9b87ad3dd9f431c733f19dfb278c7eb3dba9dca381942c79818bb42f1a566a83
    entrypoint:
      - sh
      - -c
      - >-
        sed 's|<head>|<head><meta name="gozne-application" content="quique" />|'
        /usr/share/nginx/html/admin.html > /tmp/admin.html && exec nginx -g
        'daemon off;'
    networks: [admin-entry, admin-backend]
    ports:
      - '${QUIQUE_ADMIN_BIND_ADDRESS:-127.0.0.1}:${QUIQUE_ADMIN_PORT:-9443}:8443'
    depends_on:
      admin-api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    volumes:
      - ./admin.server.conf:/etc/nginx/nginx.conf:ro
      - ./admin.server-routes.conf:/etc/nginx/admin-routes.conf:ro
      - ../login/admin.html:/usr/share/nginx/html/admin.html:ro
      - ../login/login.js:/usr/share/nginx/html/login.js:ro
      - ../login/panel.js:/usr/share/nginx/html/panel.js:ro
      - ../login/applications.js:/usr/share/nginx/html/applications.js:ro
      - ../login/style.css:/usr/share/nginx/html/style.css:ro
      - ${QUIQUE_TLS_DIRECTORY:-./tls}:/etc/nginx/tls:ro
networks:
  public-entry:
  public-backend:
    internal: true
  admin-entry:
  admin-backend:
    internal: true
volumes:
  state:
