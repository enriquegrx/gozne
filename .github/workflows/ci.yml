name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Scan repository and history
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --config /repo/.gitleaks.toml --redact --no-banner
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Build and test Linux container
        run: |
          docker build --target test -t gozne:test .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop=ALL --security-opt=no-new-privileges:true gozne:test
          docker build -t gozne:dev .
          node scripts/smoke-container.mjs
          node scripts/test-proxy.mjs
          TEST_QUIQUE=1 node scripts/test-proxy.mjs
      - name: Crash, full storage and concurrent requests
        run: node scripts/test-resilience.mjs
      - name: Generate dependency inventory
        run: |
          mkdir -p reports
          npm sbom --omit=dev --sbom-format=cyclonedx > reports/dependencies.cdx.json
      - name: Scan runtime image
        run: sh scripts/scan-image.sh
      - name: Upload dependency inventory and image findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 30
